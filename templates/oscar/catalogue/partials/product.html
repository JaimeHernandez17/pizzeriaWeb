<div class="product-card">
    <h3 class="product-title">
        <a href="{{ product.get_absolute_url }}">{{ product.title }}</a>
    </h3>
    {% if product.description %}
        <p class="product-description">
            {{ product.description|striptags|truncatewords:20 }}
        </p>
    {% endif %}
</div>
